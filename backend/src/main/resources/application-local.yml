# Local development only. The database credentials below belong to the throwaway
# container from deploy/docker-compose.dev.yml (bound to 127.0.0.1) and are not secrets.
# Real or personal overrides go to backend/.env.local (gitignored), never to this file.
spring:
  config:
    import: optional:file:./.env.local[.properties]
  datasource:
    url: jdbc:postgresql://localhost:15432/triomio
    username: triomio
    password: triomio

# http://localhost has no TLS, so a Secure cookie would never come back.
server:
  servlet:
    session:
      cookie:
        secure: false

# Local: jobs run against MockMarketplaceClient; DB modes forced OFF when no credentials.
# Ceiling stays DRY_RUN so an accidental LIVE in DB still cannot HTTP-write.
app:
  integrations:
    max-mode: ${INTEGRATIONS_MAX_MODE:DRY_RUN}
  feeds:
    dir: ${APP_FEEDS_DIR:./.local-feeds}
    token: ${APP_FEEDS_TOKEN:local-dev-feeds-token}
    public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:8080}
    # Local seed is is_demo; include so owners can inspect a real YML without live sync.
    include-demo: true
  media:
    dir: ${APP_MEDIA_DIR:./.local-media}
    public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:8080}

logging:
  level:
    com.triomio.crm: DEBUG
    org.quartz: INFO
