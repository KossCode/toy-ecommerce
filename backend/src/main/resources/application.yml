spring:
  application:
    name: triomio-crm
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: never
    wait-for-jobs-to-complete-on-shutdown: true
    # System Trigger beans overwrite themselves; user-managed triggers are scheduled only from job_schedules.
    overwrite-existing-jobs: true
    properties:
      org.quartz.scheduler.instanceName: triomio-crm
      org.quartz.threadPool.threadCount: 4
      org.quartz.jobStore.driverDelegateClass: org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
      org.quartz.jobStore.isClustered: false
      org.quartz.jobStore.misfireThreshold: 60000
  session:
    jdbc:
      initialize-schema: never
      cleanup-cron: "0 */15 * * * *"

server:
  port: 8080
  shutdown: graceful
  servlet:
    session:
      # Inactivity limit (weekends/holidays); absolute max age is enforced by SessionPolicyFilter.
      timeout: 14d
      # Name, HttpOnly and SameSite=Lax are fixed in SecurityConfig; only Secure differs (off for http://localhost).
      cookie:
        secure: true
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState, db
  info:
    env:
      enabled: true

info:
  app:
    name: triomio-crm
    version: ${APP_VERSION:dev}

# Ceiling for marketplace write mode (docs/backend/08-marketplace-sync.md §2). Override via INTEGRATIONS_MAX_MODE.
app:
  integrations:
    max-mode: ${INTEGRATIONS_MAX_MODE:DRY_RUN}
  feeds:
    dir: ${APP_FEEDS_DIR:./.local-feeds}
    token: ${APP_FEEDS_TOKEN:local-dev-feeds-token}
    public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:8080}
    include-demo: ${APP_FEEDS_INCLUDE_DEMO:false}
    dirty-poll-ms: ${APP_FEEDS_DIRTY_POLL_MS:15000}

springdoc:
  api-docs:
    path: /api/docs/openapi.json
  swagger-ui:
    path: /api/docs
  paths-to-match: /api/**
